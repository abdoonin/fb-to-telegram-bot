name: Run Facebook to Telegram Bot

on:
  schedule:
    # يتنفذ البوت تلقائياً كل ساعة (يمكنك تعديله لاحقاً)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install feedparser requests

      - name: Run script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FEED_URLS: ${{ secrets.FEED_URLS }}
        run: |
          python bot.py

      - name: Commit and push updated cache
        run: |
          git config --global user.name 'Bot Action'
          git config --global user.email 'bot@actions.local'
          git add seen_posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen posts cache" && git push)
